aid: yale-center-for-geospatial-solutions

name: Yale Center for Geospatial Solutions

description: 'The Yale Center for Geospatial Solutions (YCGS) is an interdisciplinary research center at Yale University that advances geospatial science and technology. It provides data, tools, and expertise to support transformative research, policy development, and education across environmental, social, and health domains. YCGS collaborates with academic, governmental, and private partners to enable spatial analysis, mapping, and data-driven decision making.'

